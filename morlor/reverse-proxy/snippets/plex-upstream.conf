# Shared proxy configuration that forwards requests to the Plex server.
# It is used both by the `plex.unsigned-short.com` HTTPS endpoint and by
# the dedicated public-access listener on port 32400.
set $upstream4 http://100.108.108.56:32400;
set $upstream6 http://[2a02:8308:b007:7d00:1e86:bff:fe34:1314]:32400;

location / {
    include /etc/nginx/snippets/cors.conf;
    include /etc/nginx/snippets/proxy.conf;

    # Override buffering settings.
    proxy_max_temp_file_size 0;

    proxy_pass $upstream6;
    error_page 502 = @fallback;
}

# This will pass failed requests via tailscale (in case IPv6 changes)
location @fallback {
    include /etc/nginx/snippets/cors.conf;
    include /etc/nginx/snippets/proxy.conf;

    # Override buffering settings.
    proxy_max_temp_file_size 0;

    proxy_pass $upstream4;
}
