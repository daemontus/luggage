server {
    listen 80;
    server_name plex.unsigned-short.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://plex.unsigned-short.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name plex.unsigned-short.com;

    ssl_certificate /etc/nginx/ssl/live/plex.unsigned-short.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/plex.unsigned-short.com/privkey.pem;

    include /etc/nginx/snippets/plex-upstream.conf;
}

# Dedicated listener for the Plex "public access URL" port.
# This always forwards to the Plex upstream, no matter which host name
# (domain or IP address) the client connects with. It serves plain HTTP
# only, so `http://<host>:32400` works.
server {
    listen 32400 default_server;
    listen [::]:32400 default_server;

    # Catch-all: this is the default server for the port itself.
    server_name _;

    include /etc/nginx/snippets/plex-upstream.conf;
}
